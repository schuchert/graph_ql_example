type Query {
  courseTemplates: [CourseTemplate!]!
  courseTemplate(id: ID!): CourseTemplate
  achievementTypes: [AchievementType!]!
  achievementType(id: ID!): AchievementType
}

type Mutation {
  # CourseTemplate mutations
  createCourseTemplate(
    input: CreateCourseTemplateInput!
  ): CourseTemplate!
  
  updateCourseTemplate(
    id: ID!
    input: UpdateCourseTemplateInput!
  ): CourseTemplate!
  
  deleteCourseTemplate(
    id: ID!
  ): Boolean!
  
  # CourseTemplate content management
  courseTemplateAddLmsContentTypeResource(
    courseTemplateId: ID!
    input: LmsResourceTypeResourceInput!
  ): CourseTemplate!
  
  courseTemplateAddLmsContentTypeExternal(
    courseTemplateId: ID!
    input: LmsResourceTypeExternalInput!
  ): CourseTemplate!
  
  courseTemplateAddLmsContentTypeSeparator(
    courseTemplateId: ID!
    input: LmsResourceTypeSeparatorInput!
  ): CourseTemplate!
  
  courseTemplateRemoveLmsContentType(
    courseTemplateId: ID!
    contentId: ID!
  ): CourseTemplate!
  
  courseTemplateUpdateLmsContentTypeResource(
    courseTemplateId: ID!
    contentId: ID!
    input: UpdateLmsResourceTypeResourceInput!
  ): CourseTemplate!
  
  courseTemplateUpdateLmsContentTypeExternal(
    courseTemplateId: ID!
    contentId: ID!
    input: UpdateLmsResourceTypeExternalInput!
  ): CourseTemplate!
  
  courseTemplateUpdateLmsContentTypeSeparator(
    courseTemplateId: ID!
    contentId: ID!
    input: UpdateLmsResourceTypeSeparatorInput!
  ): CourseTemplate!
  
  # AchievementType mutations (standalone)
  createAchievementType(
    input: CreateAchievementTypeInput!
  ): AchievementType!
  
  updateAchievementType(
    id: ID!
    input: UpdateAchievementTypeInput!
  ): AchievementType!
  
  deleteAchievementType(
    id: ID!
  ): Boolean!
  
  # CourseTemplate achievement management
  courseTemplateAddAchievementType(
    courseTemplateId: ID!
    input: CourseTemplateAddAchievementTypeInput!
  ): CourseTemplate!
  
  courseTemplateRemoveAchievementType(
    courseTemplateId: ID!
    achievementId: ID!
  ): CourseTemplate!
}

type CourseTemplate {
  id: ID!
  name: String!
  description: String
  lmsContentTypes: [LmsContentType!]!
  achievementTypes: [AchievementType!]!
  createdAt: String!
  updatedAt: String!
}

union LmsContentType = LmsResourceType | LmsExternalType | LmsSeparatorType

type LmsResourceType {
  id: ID!
  title: String!
  description: String
  resourceUrl: String
  order: Int!
  createdAt: String!
}

type LmsExternalType {
  id: ID!
  title: String!
  description: String
  externalUrl: String!
  order: Int!
  createdAt: String!
}

type LmsSeparatorType {
  id: ID!
  title: String!
  order: Int!
  createdAt: String!
}

type AchievementType {
  id: ID!
  name: String!
  description: String
  points: Int
  badgeUrl: String
  createdAt: String!
}

input LmsResourceTypeResourceInput {
  title: String!
  description: String
  resourceUrl: String
  order: Int
}

input LmsResourceTypeExternalInput {
  title: String!
  description: String
  externalUrl: String!
  order: Int
}

input LmsResourceTypeSeparatorInput {
  title: String!
  order: Int
}

input CreateCourseTemplateInput {
  name: String!
  description: String
}

input UpdateCourseTemplateInput {
  name: String
  description: String
}

input CreateAchievementTypeInput {
  name: String!
  description: String
  points: Int
  badgeUrl: String
}

input UpdateAchievementTypeInput {
  name: String
  description: String
  points: Int
  badgeUrl: String
}

input CourseTemplateAddAchievementTypeInput {
  name: String!
  description: String
  points: Int
  badgeUrl: String
}

input UpdateLmsResourceTypeResourceInput {
  title: String
  description: String
  resourceUrl: String
  order: Int
}

input UpdateLmsResourceTypeExternalInput {
  title: String
  description: String
  externalUrl: String
  order: Int
}

input UpdateLmsResourceTypeSeparatorInput {
  title: String
  order: Int
}

