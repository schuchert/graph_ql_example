version: '3.8'

services:
  graphql-mock-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: administrate-dx-graphql-mock
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - graphql-network

networks:
  graphql-network:
    driver: bridge

